<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2FA8B5"/>
      <stop offset="1" stop-color="#177E8C"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed square background (OS will crop any circle/squircle it wants) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g transform="translate(512,512) scale(0.78) translate(-512,-512)">
    <!-- Shield -->
    <path d="M512 196
             c 118 62 216 84 268 92
             c 6 132 -12 344 -110 470
             c -62 80 -122 118 -158 134
             c -36 -16 -96 -54 -158 -134
             c -98 -126 -116 -338 -110 -470
             c 52 -8 150 -30 268 -92 Z"
          fill="url(#shield)"/>

    <!-- Keyhole notch -->
    <circle cx="512" cy="540" r="74" fill="#111827"/>
    <path d="M512 566 L486 704 h52 Z" fill="#111827"/>

    <!-- Check -->
    <path d="M418 438 l72 70 138 -140"
          fill="none" stroke="#FFFFFF" stroke-width="56"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
